<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Verás que um filho teu não foge à luta 👀">
  <title>Run! Flavinho! Run!</title>
  <link rel="canonical" href="https://flavinho.run/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://flavinho.run/">
  <meta property="og:site_name" content="Run! Flavinho! Run!">
  <meta property="og:title" content="Run! Flavinho! Run!">
  <meta property="og:description" content="Verás que um filho teu não foge à luta 👀">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:image" content="https://flavinho.run/assets/share.jpeg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1424">
  <meta property="og:image:height" content="752">
  <meta property="og:image:alt" content="Run! Flavinho! Run! — fugindo da polícia com uma maleta de dinheiro">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Run! Flavinho! Run!">
  <meta name="twitter:description" content="Verás que um filho teu não foge à luta 👀">
  <meta name="twitter:image" content="https://flavinho.run/assets/share.jpeg">
  <meta name="twitter:image:alt" content="Run! Flavinho! Run! — fugindo da polícia com uma maleta de dinheiro">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%23000'/%3E%3Crect x='2' y='1' width='4' height='2' fill='%23F83800'/%3E%3Crect x='2' y='3' width='4' height='1' fill='%23FCE0A8'/%3E%3Crect x='2' y='4' width='4' height='1' fill='%23FCFCFC'/%3E%3Crect x='2' y='5' width='4' height='1' fill='%23FCE0A8'/%3E%3Crect x='2' y='6' width='4' height='1' fill='%23FCFCFC'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="splash">
  <canvas id="screen" aria-label="Labirinto do jogo"></canvas>

  <div id="board">
    <header id="hud">
      <div class="hud-left">
        <button id="btn-mute" type="button" aria-pressed="false">SOM</button>
        <button id="btn-crt" type="button" aria-pressed="false" aria-label="Efeito CRT">CRT</button>
      </div>
      <h1 id="title">Run! Flavinho! Run!</h1>
      <div class="hud-right" aria-live="off">
        <span id="score">PONTOS: 000000</span>
        <span id="mult">x1.0</span>
      </div>
    </header>

    <div id="countdown-box" role="timer" aria-live="off">
      <div id="countdown">-- dias --:--:--</div>
      <div id="countdown-sub">Para o fim do foro privilegiado!</div>
    </div>

    <div id="message" hidden><span id="message-text"></span></div>
    <button id="btn-ranking" type="button" hidden>Ver ranking</button>
  </div>

  <div id="crt" aria-hidden="true"></div>

  <div id="dpad" aria-hidden="true">
    <div class="btn up" data-dir="up"></div>
    <div class="btn left" data-dir="left"></div>
    <div class="btn right" data-dir="right"></div>
    <div class="btn down" data-dir="down"></div>
  </div>

  <div id="splash">
    <img src="assets/splash-v2.jpeg" alt="Run! Flavinho! Run!" width="1424" height="752" draggable="false">
    <button id="btn-start" type="button"><span>Iniciar</span></button>
  </div>

  <div id="rotate"><p>Gire o celular para jogar</p></div>

  <div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <h2 id="modal-title">PEGO!</h2>
      <p id="final-score">PONTOS: 000000</p>
      <div class="actions">
        <button id="btn-replay" type="button">Jogar novamente</button>
        <button id="btn-close" type="button" hidden>Fechar</button>
      </div>
      <section id="share" aria-label="Compartilhar pontuação">
        <p class="share-title">COMPARTILHE</p>
        <div class="share-row">
          <button type="button" data-share="whatsapp" aria-label="WhatsApp" title="WhatsApp">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
          </button>
          <button type="button" data-share="x" aria-label="X" title="X">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg>
          </button>
          <button type="button" data-share="facebook" aria-label="Facebook" title="Facebook">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          </button>
          <button type="button" data-share="telegram" aria-label="Telegram" title="Telegram">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
          </button>
          <button type="button" data-share="copy" aria-label="Copiar link" title="Copiar link">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="stroke"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          </button>
          <button type="button" data-share="native" aria-label="Mais opções" title="Mais opções" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="stroke"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>
          </button>
        </div>
        <p class="share-status" aria-live="polite"></p>
      </section>
      <form id="submit-form" novalidate>
        <div class="name-row">
          <input id="name" type="text" maxlength="50" placeholder="Seu nome" aria-label="Seu nome"
            autocomplete="nickname" spellcheck="false" required>
          <button id="btn-submit" type="submit" aria-label="Enviar pontuação">Enviar</button>
        </div>
        <div class="form-meta">
          <p id="submit-status" aria-live="polite"></p>
          <span id="name-count">0/50</span>
        </div>
      </form>
      <h3>TOP 100</h3>
      <p class="note">O ranking é atualizado a cada ~15 minutos.</p>
      <ol id="ranking-list"></ol>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
