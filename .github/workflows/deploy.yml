name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call: # used by ranking.yml (pushes made with GITHUB_TOKEN don't trigger workflows)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Latest tip of the branch, so a ranking commit made earlier in the
          # calling workflow is included.
          ref: ${{ github.ref }}

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r index.html css js assets _site/
          cp data/ranking.json _site/data/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
